<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build the Prompt</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#151517;--card:#1D1D20;--line:#2E2E32;--tx:#F5F5F7;--mu:#A1A1A6;--red:#ba0200;--ok:#2f9e5b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:20px 18px 26px;display:flex;flex-direction:column}
.logo{height:54px;width:auto;display:block;margin-bottom:18px;align-self:flex-start}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--mu);text-transform:uppercase}
h1{font-size:40px;line-height:1.1;margin:10px 0 6px}
p.sub{color:var(--mu);font-size:17px;line-height:1.5}
hr.rule{border:0;height:3px;width:56px;background:var(--red);margin:14px 0 20px}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:15px 20px;font:700 19px Cairo,sans-serif;width:100%;cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.top{display:flex;justify-content:space-between;font-size:15px;color:var(--mu)}
.dots{display:flex;gap:5px;margin:10px 0 4px}.dots i{flex:1;height:5px;border-radius:5px;background:var(--line)}.dots i.on{background:var(--red)}.dots i.done{background:var(--tx)}
h2{font-size:22px;line-height:1.3;margin:12px 0 4px}
.hint{color:var(--mu);font-size:15px;line-height:1.45;margin-bottom:10px}
.slot{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-height:54px;font-size:15px;line-height:1.4;cursor:pointer}
.slot .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.slot.f{border-style:solid;border-color:#4a4a50}
.slot.ok{background:#173a28;border-color:var(--ok);border-style:solid}.slot.ok .n{background:var(--ok)}
.slot.no{background:#3d0f0e;border-color:var(--red);border-style:solid}.slot.no .n{background:var(--red)}
.slot .nm{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:2px}
.pool{display:grid;gap:8px;margin-top:6px}
.frag{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font:400 15px/1.4 Cairo,sans-serif;color:var(--tx);text-align:left;cursor:pointer}
.frag:disabled{opacity:.25;cursor:default}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 12px}
.box .row{font-size:15px;line-height:1.45;padding:7px 0;border-bottom:1px solid var(--line)}.box .row:last-child{border:0}
.box .row b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:700}
.box .miss{color:var(--red);font-weight:700}
.opts{display:grid;gap:9px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px 15px;font:700 17px Cairo,sans-serif;color:var(--tx);text-align:left;cursor:pointer}
.opt.long{font-weight:400;font-size:15.5px;line-height:1.4}
.opt.ok{background:var(--ok);border-color:var(--ok)}.opt.no{background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin:12px 0 2px;font-size:15.5px;line-height:1.45;color:var(--mu)}.fb b{color:var(--tx)}
.score{font-size:70px;font-weight:700;line-height:1;margin-top:8px}
.list{display:grid;gap:8px;margin:14px 0 6px}
.li{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4}
.li .d{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}.d.y{background:var(--ok)}.d.n{background:var(--red)}
.li .t{color:var(--mu)}
</style></head><body><div id="app"></div>

const BLK=["Role","Context","Objective","Examples","Limitations"];
const P=[
{n:"Sketch to render",f:["You are a professional Visualizer Architect specializing in photorealistic exterior renders.","The attached hand-drawn pencil sketch shows a two-storey courtyard house clad in limestone, for a client presentation.","Convert this sketch into a 4K photorealistic render that preserves the composition and proportions exactly as drawn.","Natural limestone, dark bronze window frames, golden hour light, 35 mm lens at eye level (1.6 m).","Do not alter the roofline, add storeys, move openings, or add people or vehicles."]},
{n:"Facade material swap",f:["You are a Presentation and Graphics Architect.","The attached render shows an office facade in smooth grey concrete.","Change the concrete to dark oxidized copper with patina, keeping everything else identical.","Joints aligned to the window module, matte finish, warm sunlight.","Do not modify the glazing, add signage, or change the time of day or weather."]},
{n:"Plan to 3D cutaway",f:["You are a BIM Architect specializing in spatial layout presentation.","The attached 2D plan shows three bedrooms, an open living area and a courtyard.","Convert the plan into a 3D dollhouse cutaway in axonometric view.","Timber floors, white walls, soft uniform light.","Do not add rooms, walls or openings, and do not use perspective, labels or people."]}
];
const R=[
{t:"build",p:0},{t:"build",p:1},{t:"build",p:2},
{t:"miss",p:0,m:1,e:"Without Context the model does not know what the input is or what it is for. Context names the input asset and its purpose."},
{t:"miss",p:1,m:4,e:"Without Limitations nothing blocks the model from drifting. Limitations close the prompt with “Do not…” guardrails."},
{t:"miss",p:2,m:3,e:"Without Examples there are no measurable specs. Examples add materials, light, lens and height."},
{t:"lim",o:"Objective: Convert this sketch into a render that preserves the composition, proportions and spatial layout exactly as drawn.",a:"Do not alter the roofline, add storeys, or move or resize openings.",w:["Make it look beautiful and modern.","Use high quality and nice lighting.","Please try your best to be accurate."],e:"Every “preserve” in the Objective earns a matching “do not” that targets a specific way the model drifts."},
{t:"lim",o:"Objective: Create a faithful, bright restoration of this limestone storefront, keeping the arches and stone coursing.",a:"Do not add curtain walling or metal, change arch profiles, or over-sanitize the stone.",w:["Use warm and beautiful colors.","Make the result as modern as possible.","Add decorative details to make it richer."],e:"The limit protects what the Objective says to keep. Vague wishes and extra additions protect nothing."}
];
const MAXR=200,app=document.getElementById('app');
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
let ri,score,log;
const dots=()=>`<div class="dots">${R.map((_,k)=>`<i class="${k<ri?'done':k==ri?'on':''}"></i>`).join('')}</div>`;
const head=()=>`<div class="top"><span>Round ${ri+1} / ${R.length}</span><span>Score ${score}</span></div>${dots()}`;
function start(){app.innerHTML=`${LOGO}<p class="eyebrow">Mohannad Waleed</p><h1>Build the prompt</h1><hr class="rule"><p class="sub">Five blocks, one order: Role, Context, Objective, Examples, Limitations.<br><br>${R.length} short rounds: build prompts, spot the missing block, pick the right guardrail.</p><button class="btn" id="go" style="margin-top:26px">Start</button>`;
document.getElementById('go').onclick=()=>{ri=0;score=0;log=[];round()}}
function round(){const r=R[ri];r.t==='build'?build(r):r.t==='miss'?miss(r):lim(r)}
function next(){ri++;ri<R.length?round():end()}
function build(r){const P0=P[r.p],cor=P0.f;let order;do{order=sh([0,1,2,3,4])}while(order.every((v,k)=>v===k));
let placed=[],done=false;
app.innerHTML=`${head()}<h2>Build the prompt: ${P0.n}</h2><p class="hint">Tap the pieces in the right order. Tap a filled slot to take it back.</p><div id="sl"></div><div class="pool" id="pl"></div><button class="btn" id="ck" disabled>Check order</button>`;
const sl=document.getElementById('sl'),pl=document.getElementById('pl'),ck=document.getElementById('ck');
function draw(){sl.innerHTML='';for(let k=0;k<5;k++){const d=document.createElement('div');const v=placed[k];d.className='slot'+(v!==undefined?' f':'');
if(done){d.className='slot '+(v===k?'ok':'no')}
d.innerHTML=`<span class="n">${k+1}</span><span>${done?`<span class="nm">${BLK[k]}</span>`:''}${v!==undefined?cor[v]:''}</span>`;
if(!done&&v!==undefined)d.onclick=()=>{placed.splice(k,1);draw()};sl.appendChild(d)}
pl.innerHTML='';if(!done)order.forEach(v=>{const b=document.createElement('button');b.className='frag';b.textContent=cor[v];b.disabled=placed.includes(v);b.onclick=()=>{if(placed.length<5){placed.push(v);draw()}};pl.appendChild(b)});
ck.disabled=!done&&placed.length<5}
ck.onclick=()=>{if(!done){done=true;const c=placed.filter((v,k)=>v===k).length;const pts=c*40;score+=pts;log.push({ok:c===5,q:'Build: '+P0.n,a:c+' of 5 in place'});draw();pl.innerHTML=`<div class="fb"><b>${c===5?'Perfect order':c+' of 5 in the right place'}, +${pts}.</b> ${c===5?'Each slot names its block.':'Green slots were right. The correct order:'}</div>`+(c===5?'':`<div class="box">${cor.map((t,k)=>`<div class="row"><b>${k+1}. ${BLK[k]}</b>${t}</div>`).join('')}</div>`);ck.textContent=ri<R.length-1?'Next':'See result';ck.disabled=false}else next()};
draw()}
function miss(r){const f=P[r.p].f;app.innerHTML=`${head()}<h2>Which block is missing?</h2><p class="hint">This prompt has only four of the five blocks.</p><div class="box">${f.map((t,k)=>k===r.m?`<div class="row"><b>&nbsp;</b><span class="miss">( missing )</span></div>`:`<div class="row">${t}</div>`).join('')}</div><div class="opts" id="o"></div><div class="fb" id="f"></div><button class="btn" id="nx" style="display:none"></button>`;
const o=document.getElementById('o');let lock=false;
BLK.forEach((x,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>{if(lock)return;lock=true;const ok=k===r.m;if(ok)score+=MAXR;log.push({ok,q:'Missing block ('+P[r.p].n+')',a:BLK[r.m]});
[...o.children].forEach((c,j)=>{c.disabled=true;if(j===r.m)c.classList.add('ok');else if(c===b)c.classList.add('no')});
document.getElementById('f').innerHTML=`<b>${ok?'Correct, +'+MAXR+'.':'Not this one.'}</b> ${r.e}`;const n=document.getElementById('nx');n.style.display='block';n.textContent=ri<R.length-1?'Next':'See result';n.onclick=next};o.appendChild(b)})}
function lim(r){app.innerHTML=`${head()}<h2>Pick the limitation</h2><p class="hint">Which “Limitations” line best protects this Objective?</p><div class="box"><div class="row">${r.o}</div></div><div class="opts" id="o"></div><div class="fb" id="f"></div><button class="btn" id="nx" style="display:none"></button>`;
const o=document.getElementById('o');let lock=false;
sh([r.a,...r.w]).forEach(x=>{const b=document.createElement('button');b.className='opt long';b.textContent=x;b.onclick=()=>{if(lock)return;lock=true;const ok=x===r.a;if(ok)score+=MAXR;log.push({ok,q:'Limitation for: '+r.o.replace('Objective: ',''),a:r.a});
[...o.children].forEach(c=>{c.disabled=true;if(c.textContent===r.a)c.classList.add('ok');else if(c===b)c.classList.add('no')});
document.getElementById('f').innerHTML=`<b>${ok?'Correct, +'+MAXR+'.':'Not this one.'}</b> ${r.e}`;const n=document.getElementById('nx');n.style.display='block';n.textContent=ri<R.length-1?'Next':'See result';n.onclick=next};o.appendChild(b)})}
function end(){const mx=R.length*MAXR,pc=score/mx;const m=pc>=.9?'You write prompts like a pro.':pc>=.7?'Strong structure. Review the weak spots.':pc>=.5?'Good start. Revisit the five blocks slide.':'Revisit the prompt engineering section.';
app.innerHTML=`${LOGO}<p class="eyebrow">Result</p><div class="score">${score}</div><p class="sub" style="margin-top:6px">out of ${mx} · ${m}</p><div class="list">${log.map(l=>`<div class="li"><div class="d ${l.ok?'y':'n'}">${l.ok?'✓':'✕'}</div><div>${l.q}<br><span class="t">${l.a}</span></div></div>`).join('')}</div><button class="btn ghost" id="re">Play again</button>`;document.getElementById('re').onclick=start}
start();
</script></body></html>
